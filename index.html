<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>貪食蛇｜單頁小遊戲</title>
<style>
:root{color-scheme:dark;font-family:system-ui,'Microsoft JhengHei',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#1e3950,#0a1220 65%);color:#edf6ff}.panel{width:min(94vw,560px);padding:24px;border:1px solid #39506a;border-radius:22px;background:#142338;box-shadow:0 20px 70px #0007}h1{margin:0 0 6px;text-align:center;font-size:30px}.hint{text-align:center;color:#a7bed2;margin:0 0 18px}.stats{display:flex;justify-content:space-around;margin-bottom:15px;gap:10px}.stat{flex:1;text-align:center;background:#20364d;border-radius:12px;padding:10px}.stat b{display:block;font-size:24px;color:#7ef5b2}.stat small{color:#b6c9d9}canvas{display:block;width:100%;aspect-ratio:1;background:#0b1926;border:2px solid #38546a;border-radius:12px;touch-action:none}.actions{display:flex;gap:10px;margin-top:16px}button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px;background:#4fe19b;color:#102b28;padding:12px 18px;flex:1}button.secondary{background:#344c65;color:white}button:focus-visible{outline:3px solid white;outline-offset:3px}.controls{display:grid;grid-template-columns:repeat(3,56px);gap:7px;justify-content:center;margin-top:15px}.controls button{padding:10px;min-height:44px;background:#344c65;color:white}.controls .empty{visibility:hidden}.foot{text-align:center;color:#a7bed2;font-size:13px;margin-top:14px}
</style></head>
<body><main class="panel"><h1>🐍 貪食蛇</h1><p class="hint">吃掉紅色食物，挑戰最高分！</p><div class="stats"><div class="stat"><small>目前分數</small><b id="score">0</b></div><div class="stat"><small>最高分</small><b id="best">0</b></div><div class="stat"><small>等級</small><b id="level">1</b></div></div><canvas id="game" width="480" height="480" aria-label="貪食蛇遊戲畫面"></canvas><div class="actions"><button id="start">開始遊戲</button><button class="secondary" id="pause">暫停</button></div><div class="controls" aria-label="方向控制"><span class="empty"></span><button data-dir="up" aria-label="向上">▲</button><span class="empty"></span><button data-dir="left" aria-label="向左">◀</button><button data-dir="down" aria-label="向下">▼</button><button data-dir="right" aria-label="向右">▶</button></div><div class="foot">鍵盤方向鍵 / WASD 移動 · 空白鍵暫停 · 手機可使用方向按鈕</div></main>
<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),levelEl=document.querySelector('#level'),startBtn=document.querySelector('#start'),pauseBtn=document.querySelector('#pause');const N=20,S=canvas.width/N;let snake,food,dir,nextDir,score,level,state='ready',timer=null;let best=0;try{best=Number(localStorage.getItem('snake-best'))||0}catch{}bestEl.textContent=best;
const vectors={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={...vectors.right};nextDir={...dir};score=0;level=1;scoreEl.textContent=0;levelEl.textContent=1;placeFood();draw()}
function placeFood(){const empty=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))empty.push({x,y});food=empty.length?empty[Math.floor(Math.random()*empty.length)]:null}
function stop(){clearTimeout(timer);timer=null}function schedule(){stop();if(state==='playing')timer=setTimeout(tick,Math.max(65,155-(level-1)*10))}
function start(){stop();reset();state='playing';startBtn.textContent='重新開始';pauseBtn.textContent='暫停';schedule()}
function tick(){if(state!=='playing')return;dir={...nextDir};const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eating=food&&head.x===food.x&&head.y===food.y;const body=eating?snake:snake.slice(0,-1);if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){state='over';stop();draw();overlay('遊戲結束','按「重新開始」再挑戰');return}snake.unshift(head);if(eating){score+=10;level=1+Math.floor(score/50);scoreEl.textContent=score;levelEl.textContent=level;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('snake-best',String(best))}catch{}}placeFood();if(!food){state='won';stop();draw();overlay('恭喜過關！','你填滿了整個地圖');return}}else snake.pop();draw();schedule()}
function draw(){ctx.fillStyle='#0b1926';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#172b39';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,480);ctx.moveTo(0,i*S);ctx.lineTo(480,i*S);ctx.stroke()}if(food){ctx.fillStyle='#ff6575';ctx.beginPath();ctx.arc((food.x+.5)*S,(food.y+.5)*S,S*.36,0,Math.PI*2);ctx.fill()}snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#a2ffd0':'#42d897';ctx.beginPath();ctx.roundRect(p.x*S+2,p.y*S+2,S-4,S-4,6);ctx.fill()});if(state==='ready')overlay('準備好了嗎？','點擊「開始遊戲」')}
function overlay(title,sub){ctx.fillStyle='#07111bba';ctx.fillRect(0,0,480,480);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 34px system-ui';ctx.fillText(title,240,228);ctx.font='18px system-ui';ctx.fillStyle='#b9d2e3';ctx.fillText(sub,240,265)}
function changeDirection(name){const d=vectors[name];if(!d||state!=='playing')return;if(d.x===-dir.x&&d.y===-dir.y)return;nextDir={...d}}
function togglePause(){if(state==='playing'){state='paused';stop();draw();overlay('已暫停','按空白鍵或繼續遊戲');pauseBtn.textContent='繼續'}else if(state==='paused'){state='playing';pauseBtn.textContent='暫停';draw();schedule()}}
startBtn.addEventListener('click',start);pauseBtn.addEventListener('click',togglePause);document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>changeDirection(b.dataset.dir)));document.addEventListener('keydown',e=>{const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};const key=e.key.length===1?e.key.toLowerCase():e.key;if(keys[key]){e.preventDefault();changeDirection(keys[key])}else if(e.code==='Space'){e.preventDefault();togglePause()}});reset();})();
</script></body></html>
